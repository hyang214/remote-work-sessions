name: Feature request
description: Propose a focused improvement to Remote Work Sessions.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the user problem without private environment details.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: true
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: This stays focused on persistent remote shell sessions over SSH.
          required: true
        - label: I removed usernames, hosts, addresses, credentials, and private URLs.
          required: true
