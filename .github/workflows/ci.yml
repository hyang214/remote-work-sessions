name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22.14.0, 24]
    steps:
      - name: Check out source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Install package metadata
        run: npm ci --ignore-scripts
      - name: Run release checks
        run: npm run test:release

  quality-gate:
    name: Quality
    if: ${{ always() }}
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every Node.js quality job
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
        run: test "$QUALITY_RESULT" = success

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends shellcheck
      - name: Check shell sources
        run: |
          git ls-files -z 'bin/*' 'scripts/*.sh' 'tests/**/*.sh' |
            xargs -0 shellcheck --rcfile=.shellcheckrc --severity=warning

  public-history:
    name: Public history
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out complete history
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
      - name: Scan source and history
        run: scripts/verify-public-release.sh --history

  e2e:
    name: Podman E2E
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install Podman
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends podman
      - name: Install package metadata
        run: npm ci --ignore-scripts
      - name: Run real SSH and shpool lifecycle
        run: npm run test:e2e
